#-------------------------------------------------------------
# ipcheck.properties
#-------------------------------------------------------------

# IP封包驗證策略(當本項設定為TRUE後續各項設置均會被忽略)
IPCHECKPACK = false

#-------------------------------------------------------------
#限制同IP連線數量
ipcount = 4

# 啟用IP檢查策略
# 串連設定
IPCHECK = false

# 相同IP指定秒數內重複連結列入計算(毫秒)
# 指定秒數內重複連結 錯誤次數+1
TIMEMILLIS = 15000

# 達到指定次數切斷相同IP所有連線
COUNT = 2

# 達到指定次數是否封鎖IP並寫入資料庫(true:是 false:否)
SETDB = true

# 如果是LINUX系統 是否加入ufw 封鎖清單(true:是 false:否)
# 這設置對WINDOWS系統無效果
# 這設置 必須SETDB = true 才有效果
UFW = false
#-------------------------------------------------------------
# 1個IP僅允許一個連線
ISONEIP = false
#-------------------------------------------------------------

#1個IP只定時間內僅允許連限一個(毫秒) 0:不啟用
ONETIMEMILLIS = 0

#連線逾時切斷連線設置(單位：秒)
timeOutSocket = 3600