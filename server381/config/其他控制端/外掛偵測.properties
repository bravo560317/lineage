#-------------------------------------------------------------
# 外掛偵測 相關設置  (必須打怪 才會進行偵測 打王不偵測)
#-------------------------------------------------------------
#是否開放偵測外掛(對話視窗滑鼠點數字驗證(隨機)
longntimeai_3 = false

#登入後多久後偵測 + 隨機秒數(秒計算)
logintime = 5
#驗證成功後下次再次驗證時間  + 隨機時間
aitimelast = 10
#隨機秒數
aitimeran = 3

#外掛驗證特效
AIeffect = 227

#ALT+E申訴指定玩家 進行外掛偵測 true=玩家可以 false=玩家不可(目前尚未開放)
ALTE = false
#防止濫用 限制金額
aialteitem = 40308
#數量
aialteitemcount = 500000000


#未通過驗證是否斷現 true =斷現 false= 傳出座標555
kickai = false
#X座標
aiX = 33437
#Y座標
aiY = 32790
#Mapid
aimap = 4


#第一種外掛相關文字
msg0 = \\f2請輸輸入頭上特效數字
msg3 = \\f2AI驗證題目驗證:成功。
msg4 = \\f2感謝您的配合
msg5 = \\fU[您輸入答案錯誤請在答一次]
msg6 = \\fU[再輸入3次將剔除下線警告]


#第二種外掛相關文字(3~6控制文字與第一種驗證同步控制)
