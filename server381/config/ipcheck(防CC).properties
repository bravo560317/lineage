#-------------------------------------------------------------
# ipcheck.properties
#-------------------------------------------------------------

# IP封包驗證策略(當本項設定為TRUE後續各項設置均會被忽略)
IPCHECKPACK = false

#-------------------------------------------------------------
#限制同IP連線數量
ipcount = 4

# 啟用IP檢查策略 - ★ 必須改為 true
IPCHECK = true

# 相同IP指定秒數內重複連結 (15000毫秒 = 15秒)
# 15秒對一般玩家太長，建議縮短，增加靈敏度
TIMEMILLIS = 3000

# 達到指定次數切斷連線
# 建議設為 3-5 次，給正常玩家一點點失誤空間
COUNT = 15

# 達到指定次數封鎖IP並寫入資料庫
SETDB = true

# 如果是LINUX系統 是否加入ufw 封鎖清單(true:是 false:否)
# 這設置對WINDOWS系統無效果
# 這設置 必須SETDB = true 才有效果
UFW = false


# 1個IP僅允許一個連線 - ★ 強烈建議開啟 (視你的伺服器需求)
# 如果是針對駭客攻擊，開啟這個效果最明顯
ISONEIP = false

# 1個IP指定時間內僅允許連線一個 (毫秒)
# 設為 5000 (5秒)，防止短時間內大量開啟登入器
TIMEMILLIS = 15000

#連線逾時切斷連線設置(單位：秒)
timeOutSocket = 60
